name: Finalize minimal verified shadow wiring

on:
  push:
    paths:
      - '.github/shadow-wiring-write-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal verified patch and clean transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/shadow-wiring-direct.patch
          git apply .github/shadow-wiring-direct.patch
          node --check src/main.js
          rm reference/shadow-wiring.md
          rm .github/shadow-wiring-direct.patch
          rm .github/workflows/apply-shadow-wiring.yml
          rm .github/workflows/apply-shadow-wiring-write.yml
          rm .github/shadow-wiring-trigger
          rm .github/shadow-wiring-write-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire the lamp shadow pass into the game loop'
          git push
