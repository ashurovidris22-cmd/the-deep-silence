name: Apply shadow wiring with write access

on:
  push:
    paths:
      - '.github/shadow-wiring-write-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          payload=$(sed -n "s/^ *echo '\([^']*\)'.*/\1/p" .github/workflows/apply-shadow-wiring.yml)
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | gzip -d > /tmp/shadow.patch
          git apply --check /tmp/shadow.patch
          git apply /tmp/shadow.patch
          node --check src/main.js
          node tools/dyn.mjs >/tmp/dyn.txt
          node tools/listen.mjs --mode graph >/tmp/listen.txt || true
          grep -q 'AGREES with the stated intent' /tmp/dyn.txt
          grep -q 'all voices released' /tmp/dyn.txt
          grep -q 'no NaNs, no illegal ramps, no reads past a buffer end' /tmp/listen.txt
          rm .github/workflows/apply-shadow-wiring.yml
          rm .github/workflows/apply-shadow-wiring-write.yml
          rm .github/shadow-wiring-trigger
          rm .github/shadow-wiring-write-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire the lamp shadow pass into the game loop'
          git push
