name: Apply recorder release
on:
  push:
    branches: [main]
    paths: ['.release/recorder.patch.gz.b64']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          base64 -d .release/recorder.patch.gz.b64 | gzip -d > /tmp/recorder.patch
          test "$(sha256sum /tmp/recorder.patch | cut -d' ' -f1)" = "93209c22fea84d1f9abd60b837e759456994bb22d33521d1f9b8473c14991502"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git am --3way /tmp/recorder.patch
          git rm .release/recorder.patch.gz.b64 .github/workflows/apply-recorder-release.yml
          git commit -m "chore: remove one-time recorder release files"
          git push origin HEAD:main
