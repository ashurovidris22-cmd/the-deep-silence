name: Apply creature release
on:
  push:
    branches: [main]
    paths: ['.release/creature.patch.gz.b64']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          base64 -d .release/creature.patch.gz.b64 | gzip -d > /tmp/creature.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git am --3way /tmp/creature.patch
          git rm .release/creature.patch.gz.b64 .github/workflows/apply-creature-release.yml
          git commit -m "chore: remove one-time creature release files"
          git push origin HEAD:main
