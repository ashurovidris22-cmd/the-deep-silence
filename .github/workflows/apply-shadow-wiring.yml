name: Apply verified shadow wiring

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/shadow.patch
          git apply --check /tmp/shadow.patch
          git apply /tmp/shadow.patch
          node --check src/main.js
          node tools/dyn.mjs >/tmp/dyn.txt
          node tools/listen.mjs --mode graph >/tmp/listen.txt
          grep -q 'AGREES with the stated intent' /tmp/dyn.txt
          grep -q 'all voices released' /tmp/dyn.txt
          grep -q 'no NaNs, no illegal ramps, no reads past a buffer end' /tmp/listen.txt
          rm .github/workflows/apply-shadow-wiring.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire the lamp shadow pass into the game loop'
          git push
