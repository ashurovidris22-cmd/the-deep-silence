<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Deep Silence</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }

  /* Boot gate. The renderer warms shaders and bakes noise before first frame;
     showing a black screen for two seconds reads as a hang, so hold a card. */
  #boot {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:#04080a; transition:opacity .9s ease;
    font:400 13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.34em; text-transform:uppercase; color:#4d7f8c;
  }
  #boot h1 {
    margin:0; font:300 clamp(26px,5.4vw,58px)/1 ui-monospace,monospace;
    letter-spacing:.42em; color:#9fd3dd; text-indent:.42em;
    text-shadow:0 0 34px rgba(80,190,215,.34);
  }
  #bootSub { opacity:.5; font-size:11px; }
  #bootStart {
    appearance:none; cursor:pointer; padding:15px 40px;
    background:transparent; color:#9fd3dd;
    border:1px solid rgba(159,211,221,.32); border-radius:1px;
    font:400 12px/1 ui-monospace,monospace; letter-spacing:.34em;
    text-transform:uppercase; transition:.28s;
  }
  #bootStart:hover { background:rgba(159,211,221,.09); border-color:rgba(159,211,221,.62); }
  #bootStart[hidden] { display:none; }
  #bootProg { font-size:11px; opacity:.42; }

  #bootKeys {
    display:flex; flex-wrap:wrap; gap:10px 26px; justify-content:center;
    max-width:620px; padding:0 24px;
    font:400 10px/1.9 ui-monospace,monospace; letter-spacing:.2em;
    color:rgba(140,195,207,.5);
  }
  #bootKeys kbd {
    display:inline-block; min-width:15px; margin:0 1px; padding:2px 5px;
    border:1px solid rgba(159,211,221,.26); border-radius:2px;
    font:inherit; letter-spacing:.12em; color:rgba(190,232,242,.82);
  }

  #hud {
    position:fixed; left:0; right:0; bottom:0; z-index:5; padding:20px 26px;
    display:flex; justify-content:space-between; align-items:flex-end;
    font:400 11px/1.5 ui-monospace,monospace; letter-spacing:.2em;
    color:rgba(150,205,215,.62); text-transform:uppercase;
    text-shadow:0 1px 12px rgba(0,0,0,.9); pointer-events:none;
  }
  #hud b { display:block; font-weight:400; font-size:22px; letter-spacing:.1em;
           color:rgba(190,235,245,.9); }
  #hud .u { font-size:10px; opacity:.5; }
  #hud[hidden] { display:none; }

  /* Left-aligned and a size up from the old corner readout, because this is now
     something a player is asked to photograph and send. A right-aligned block of
     key/value lines is unreadable in a screenshot. */
  #stats {
    position:fixed; right:10px; top:10px; z-index:6;
    font:400 12px/1.6 ui-monospace,monospace; color:rgba(170,225,235,.72);
    text-align:left; white-space:pre; pointer-events:none;
    background:rgba(0,0,0,.34); padding:8px 11px; border-radius:3px;
  }
  #stats[hidden] { display:none; }

  #legend {
    position:fixed; left:22px; top:20px; z-index:5; pointer-events:none;
    font:400 10px/1.9 ui-monospace,monospace; letter-spacing:.18em;
    color:rgba(150,205,215,.44); text-transform:uppercase;
    text-shadow:0 1px 10px rgba(0,0,0,.95);
  }
  #legTitle { color:rgba(180,225,235,.6); margin-bottom:5px; letter-spacing:.3em; }
  #legend b { display:inline-block; min-width:74px; font-weight:400;
              color:rgba(195,235,245,.82); }
  #legend[hidden] { display:none; }

  #prompt {
    position:fixed; left:50%; bottom:19%; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:11px; pointer-events:none;
    padding:9px 18px; border:1px solid rgba(159,211,221,.22); border-radius:2px;
    background:rgba(4,12,16,.42);
    font:400 12px/1 ui-monospace,monospace; letter-spacing:.22em;
    color:rgba(205,240,248,.92); text-transform:uppercase;
    text-shadow:0 1px 10px rgba(0,0,0,.9);
  }
  #prompt kbd {
    padding:3px 8px; border:1px solid rgba(159,211,221,.42); border-radius:2px;
    color:rgba(225,248,255,.98);
  }
  #prompt[hidden] { display:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div><span class="u">Depth</span><b id="hDepth">0</b><span class="u">metres</span></div>
  <div style="text-align:center"><span class="u">Speed</span><b id="hSpeed">0.0</b><span class="u">m / s</span></div>
  <div style="text-align:right"><span class="u">Pressure</span><b id="hHull">1</b><span class="u">atmospheres</span></div>
</div>
<div id="stats" hidden></div>

<!-- Always on screen. A control scheme that only appears on the loading card is
     a control scheme the player has already forgotten. -->
<div id="legend">
  <div id="legTitle">Controls</div>
  <div id="legBody"></div>
</div>

<!-- Contextual prompt. The single most important piece of UI in the build: with
     no prompt, standing next to a pilot's seat looks exactly like standing next
     to a wall, and the player has no way to learn that E does anything. -->
<div id="prompt" hidden><kbd>E</kbd><span id="promptText"></span></div>

<div id="boot">
  <h1>The Deep Silence</h1>
  <div id="bootSub">Descent vehicle · pressure hull rated 6000 m</div>
  <button id="bootStart" hidden>Begin descent</button>
  <div id="bootKeys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> thrust</span>
    <span><kbd>mouse</kbd> look</span>
    <span><kbd>space</kbd> / <kbd>C</kbd> ballast</span>
    <span><kbd>shift</kbd> transit</span>
    <span><kbd>L</kbd> lamp</span>
    <span><kbd>M</kbd> mute</span>
    <span><kbd>[</kbd> <kbd>]</kbd> dive band</span>
    <span><kbd>esc</kbd> release cursor</span>
  </div>
  <div id="bootProg">initialising</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
